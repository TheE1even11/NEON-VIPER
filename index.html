<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>NEON VIPER // OVERDRIVE</title>
  <style>
    :root {
      --bg-color: #08090f;
      --panel-bg: rgba(14, 17, 27, 0.82);
      --panel-border: rgba(0, 243, 255, 0.35);
      --cyan: #00f3ff;
      --magenta: #ff0055;
      --gold: #ffe600;
      --lime: #00ff66;
      --purple: #9d00ff;
      --text: #ffffff;
      --font-main: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-color);
      font-family: var(--font-main);
      color: var(--text);
      touch-action: none;
    }

    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, #101426 0%, #05060a 100%);
    }

    canvas#canvas {
      display: block;
      box-shadow: 0 0 50px rgba(0, 243, 255, 0.15);
    }

    /* UI Layer */
    .ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      z-index: 10;
    }

    /* HUD */
    .hud {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 16px 24px;
      pointer-events: auto;
    }

    .hud-box {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      backdrop-filter: blur(8px);
      padding: 8px 16px;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    .hud-label {
      font-size: 10px;
      letter-spacing: 2px;
      color: var(--cyan);
      font-weight: 700;
      text-transform: uppercase;
    }

    .hud-value {
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 1px;
      font-variant-numeric: tabular-nums;
    }

    .hud-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .combo-meter {
      width: 140px;
      height: 8px;
      background: rgba(255,255,255,0.1);
      border-radius: 4px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.2);
    }

    .combo-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--cyan), var(--magenta));
      transition: width 0.05s linear;
    }

    .combo-text {
      font-size: 12px;
      font-weight: 800;
      color: var(--gold);
      letter-spacing: 1px;
    }

    .hud-buttons {
      display: flex;
      gap: 10px;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      color: var(--cyan);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      cursor: pointer;
      backdrop-filter: blur(8px);
      pointer-events: auto;
      transition: all 0.2s;
    }

    .icon-btn:hover, .icon-btn:active {
      background: var(--cyan);
      color: #000;
      box-shadow: 0 0 15px var(--cyan);
    }

    /* Boost Gauge */
    .boost-container {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      pointer-events: none;
    }

    .boost-bar {
      width: 200px;
      height: 10px;
      background: rgba(0,0,0,0.6);
      border: 1px solid rgba(0, 243, 255, 0.4);
      border-radius: 5px;
      overflow: hidden;
    }

    .boost-fill {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #0077ff, var(--cyan));
      box-shadow: 0 0 10px var(--cyan);
      transition: width 0.05s linear;
    }

    .boost-label {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 2px;
      color: var(--cyan);
    }

    /* Overlays / Screens */
    .overlay-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(6, 8, 15, 0.85);
      backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 20;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .overlay-screen.active {
      opacity: 1;
      pointer-events: auto;
    }

    .title-logo {
      font-size: clamp(36px, 8vw, 64px);
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 4px;
      text-align: center;
      background: linear-gradient(135deg, var(--cyan) 0%, #fff 50%, var(--magenta) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 20px rgba(0, 243, 255, 0.5));
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: clamp(12px, 3vw, 16px);
      letter-spacing: 4px;
      color: var(--gold);
      text-transform: uppercase;
      margin-bottom: 30px;
      font-weight: 700;
    }

    .card {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      padding: 24px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .btn {
      background: linear-gradient(90deg, var(--cyan), #00a2ff);
      color: #05060a;
      border: none;
      padding: 14px 24px;
      border-radius: 8px;
      font-weight: 900;
      font-size: 16px;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(0, 243, 255, 0.4);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .btn:hover, .btn:active {
      transform: scale(1.02);
      box-shadow: 0 0 30px rgba(0, 243, 255, 0.8);
      filter: brightness(1.15);
    }

    .btn-secondary {
      background: transparent;
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.3);
      box-shadow: none;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: #fff;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .stat-box {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 10px;
      border-radius: 6px;
      text-align: center;
    }

    .stat-title {
      font-size: 10px;
      color: #8892b0;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .stat-num {
      font-size: 20px;
      font-weight: 800;
      color: #fff;
      margin-top: 2px;
    }

    .controls-hint {
      display: flex;
      justify-content: space-around;
      font-size: 12px;
      color: #8892b0;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-top: 12px;
      text-align: center;
    }

    .controls-hint span b {
      color: var(--cyan);
    }
        /* Leaderboard list */
    .leaderboard-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 6px;
    }

    .leaderboard-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 12px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 4px;
      font-size: 13px;
    }

    .leaderboard-item:first-child {
      background: rgba(255, 230, 0, 0.1);
      border: 1px solid rgba(255, 230, 0, 0.3);
      color: var(--gold);
    }

    /* Touch Controls */
    .touch-controls {
      position: absolute;
      bottom: 20px;
      left: 0;
      width: 100%;
      height: 180px;
      display: none;
      justify-content: space-between;
      align-items: center;
      padding: 0 24px;
      pointer-events: none;
      z-index: 15;
    }

    @media (pointer: coarse), (max-width: 900px) {
      .touch-controls {
        display: flex;
      }
      .boost-container {
        bottom: 90px;
      }
    }

    .dpad-zone {
      width: 150px;
      height: 150px;
      position: relative;
      pointer-events: auto;
      background: rgba(255,255,255,0.03);
      border: 1px dashed rgba(0, 243, 255, 0.2);
      border-radius: 50%;
    }

    .dpad-btn {
      position: absolute;
      width: 46px;
      height: 46px;
      background: rgba(14, 17, 27, 0.7);
      border: 1px solid var(--panel-border);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--cyan);
      font-size: 20px;
      font-weight: bold;
    }

    .dpad-btn:active {
      background: var(--cyan);
      color: #000;
    }

    .dpad-up    { top: 2px; left: 52px; }
    .dpad-down  { bottom: 2px; left: 52px; }
    .dpad-left  { top: 52px; left: 2px; }
    .dpad-right { top: 52px; right: 2px; }

    .touch-action-btn {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0,243,255,0.3) 0%, rgba(14,17,27,0.8) 70%);
      border: 2px solid var(--cyan);
      color: #fff;
      font-size: 14px;
      font-weight: 900;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
      box-shadow: 0 0 25px rgba(0,243,255,0.3);
    }

    .touch-action-btn:active, .touch-action-btn.active {
      background: var(--cyan);
      color: #000;
      transform: scale(0.94);
      box-shadow: 0 0 35px var(--cyan);
    }

    /* Floating Banner / New High Score */
    .banner {
      background: linear-gradient(90deg, var(--magenta), var(--purple));
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 2px;
      animation: pulse 1s infinite alternate;
      align-self: center;
      display: none;
    }

    @keyframes pulse {
      0% { transform: scale(1); filter: brightness(1); }
      100% { transform: scale(1.08); filter: brightness(1.3); box-shadow: 0 0 20px var(--magenta); }
    }
  </style>
</head>
<body>

  <div id="game-container">
    <canvas id="canvas"></canvas>

    <!-- UI Overlay Layer -->
    <div class="ui-layer">
      <!-- HUD Top -->
      <div class="hud">
        <div class="hud-box">
          <span class="hud-label">Score</span>
          <span class="hud-value" id="hud-score">000,000</span>
        </div>

        <div class="hud-center">
          <div class="hud-label">Multiplier</div>
          <div class="combo-meter">
            <div class="combo-fill" id="combo-fill"></div>
          </div>
          <span class="combo-text" id="combo-text">1.0X</span>
        </div>

        <div class="hud-buttons">
          <div class="hud-box" style="padding: 8px 12px;">
            <span class="hud-label">High</span>
            <span class="hud-value" id="hud-high" style="font-size: 18px; color: var(--gold);">0</span>
          </div>
          <button class="icon-btn" id="btn-sound" title="Toggle Sound">🔊</button>
          <button class="icon-btn" id="btn-pause" title="Pause Game">⏸</button>
        </div>
      </div>

      <!-- Boost Gauge -->
      <div class="boost-container">
        <span class="boost-label">HYPER BOOST [SPACE / HOLD]</span>
        <div class="boost-bar">
          <div class="boost-fill" id="boost-fill"></div>
        </div>
      </div>

      <!-- Touch Controls Layer -->
      <div class="touch-controls">
        <div class="dpad-zone" id="dpad-touch-area">
          <div class="dpad-btn dpad-up" id="t-up">▲</div>
          <div class="dpad-btn dpad-down" id="t-down">▼</div>
          <div class="dpad-btn dpad-left" id="t-left">◀</div>
          <div class="dpad-btn dpad-right" id="t-right">▶</div>
        </div>
        <div class="touch-action-btn" id="t-boost">BOOST</div>
      </div>
    </div>

    <!-- START SCREEN -->
    <div class="overlay-screen active" id="screen-start">
      <h1 class="title-logo">Neon Viper</h1>
      <div class="subtitle">// OVERDRIVE REMIX //</div>
      <div class="card">
        <button class="btn" id="btn-play">
          <span>⚡ START OVERDRIVE</span>
        </button>
        <div class="controls-hint">
          <span><b>WASD / Arrows</b> Steer</span>
          <span><b>SPACE / Hold</b> Boost</span>
          <span><b>P / ESC</b> Pause</span>
        </div>
        <div class="hud-label" style="text-align: center; margin-top: 4px;">Top Pilots</div>
        <div class="leaderboard-list" id="start-leaderboard"></div>
      </div>
    </div>

    <!-- PAUSE SCREEN -->
    <div class="overlay-screen" id="screen-pause">
      <h1 class="title-logo" style="font-size: 42px;">SYSTEM PAUSED</h1>
      <div class="card">
        <button class="btn" id="btn-resume">▶ RESUME</button>
        <button class="btn btn-secondary" id="btn-restart-pause">↺ RESTART</button>
      </div>
    </div>

    <!-- GAME OVER SCREEN -->
    <div class="overlay-screen" id="screen-gameover">
      <div class="banner" id="new-high-banner">NEW HIGH SCORE!</div>
      <h1 class="title-logo" style="font-size: 48px; margin-top: 8px;">SIGNAL LOST</h1>
      <div class="card">
        <div class="stats-grid">
          <div class="stat-box">
            <div class="stat-title">Final Score</div>
            <div class="stat-num" id="go-score" style="color: var(--cyan);">0</div>
          </div>
          <div class="stat-box">
            <div class="stat-title">Max Combo</div>
            <div class="stat-num" id="go-combo" style="color: var(--gold);">1.0x</div>
          </div>
          <div class="stat-box">
            <div class="stat-title">Orbs Siphoned</div>
            <div class="stat-num" id="go-orbs">0</div>
          </div>
          <div class="stat-box">
            <div class="stat-title">Survival Time</div>
            <div class="stat-num" id="go-time">00:00</div>
          </div>
        </div>

        <button class="btn" id="btn-restart">
          <span>↺ PLAY AGAIN (R)</span>
        </button>
        <button class="btn btn-secondary" id="btn-menu">MENU</button>
      </div>
    </div>
  </div>

  <script>
    /* =====================================================================
       NEON VIPER // AUDIO SYNTHESIZER (Web Audio API - Zero Dependencies)
       ===================================================================== */
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.muted = false;
        this.pentatonic = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25, 783.99, 880.00];
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      toggleMute() {
        this.muted = !this.muted;
        return this.muted;
      }

      playBite(comboIndex = 0) {
        if (this.muted || !this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        const freq = this.pentatonic[comboIndex % this.pentatonic.length];
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, now);
        osc.frequency.exponentialRampToValueAtTime(freq * 1.5, now + 0.12);

        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.12);
      }

      playSuperBite() {
        if (this.muted || !this.ctx) return;
        const now = this.ctx.currentTime;
        [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          const startTime = now + idx * 0.035;

          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, startTime);
          gain.gain.setValueAtTime(0.2, startTime);
          gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.2);

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(startTime);
          osc.stop(startTime + 0.2);
        });
      }

      playPowerup() {
        if (this.muted || !this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(220, now);
        osc.frequency.exponentialRampToValueAtTime(880, now + 0.25);

        gain.gain.setValueAtTime(0.2, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.25);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.25);
      }

      playDie() {
        if (this.muted || !this.ctx) return;
        const now = this.ctx.currentTime;

        // Bass drop
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(160, now);
        osc.frequency.exponentialRampToValueAtTime(30, now + 0.5);

        gain.gain.setValueAtTime(0.5, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.5);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.5);

        // Noise blast
        const bufferSize = this.ctx.sampleRate * 0.4;
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = Math.random() * 2 - 1;
        }

        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;
        const noiseGain = this.ctx.createGain();
        noiseGain.gain.setValueAtTime(0.4, now);
        noiseGain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);

        noise.connect(noiseGain);
        noiseGain.connect(this.ctx.destination);
        noise.start(now);
      }

      playBoost() {
        if (this.muted || !this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(120, now);
        osc.frequency.linearRampToValueAtTime(220, now + 0.08);

        gain.gain.setValueAtTime(0.12, now);
        gain.gain.linearRampToValueAtTime(0.001, now + 0.08);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.08);
      }
    }

    const sound = new SoundEngine();
        /* =====================================================================
       PARTICLE & JUICE SYSTEM
       ===================================================================== */
    class ParticlePool {
      constructor() {
        this.particles = [];
        this.floatingTexts = [];
        this.shockwaves = [];
      }

      spawn(x, y, color, count = 12, speed = 4) {
        for (let i = 0; i < count; i++) {
          const angle = Math.random() * Math.PI * 2;
          const spd = (Math.random() * 0.7 + 0.3) * speed;
          this.particles.push({
            x, y,
            vx: Math.cos(angle) * spd,
            vy: Math.sin(angle) * spd,
            color,
            size: Math.random() * 3 + 2,
            alpha: 1,
            decay: Math.random() * 0.02 + 0.02
          });
        }
      }

      spawnText(x, y, text, color = '#ffe600') {
        this.floatingTexts.push({
          x, y,
          text,
          color,
          alpha: 1,
          vy: -1.2,
          scale: 1.2
        });
      }

      spawnShockwave(x, y, color = '#00f3ff') {
        this.shockwaves.push({
          x, y,
          radius: 4,
          maxRadius: 60,
          color,
          alpha: 1
        });
      }

      update(dt) {
        // Particles
        for (let i = this.particles.length - 1; i >= 0; i--) {
          const p = this.particles[i];
          p.x += p.vx;
          p.y += p.vy;
          p.vx *= 0.96;
          p.vy *= 0.96;
          p.alpha -= p.decay;
          if (p.alpha <= 0) this.particles.splice(i, 1);
        }

        // Floating texts
        for (let i = this.floatingTexts.length - 1; i >= 0; i--) {
          const ft = this.floatingTexts[i];
          ft.y += ft.vy;
          ft.alpha -= 0.02;
          ft.scale = Math.max(1.0, ft.scale - 0.01);
          if (ft.alpha <= 0) this.floatingTexts.splice(i, 1);
        }

        // Shockwaves
        for (let i = this.shockwaves.length - 1; i >= 0; i--) {
          const sw = this.shockwaves[i];
          sw.radius += 3.2;
          sw.alpha = 1 - (sw.radius / sw.maxRadius);
          if (sw.radius >= sw.maxRadius) this.shockwaves.splice(i, 1);
        }
      }

      draw(ctx) {
        ctx.save();
        // Shockwaves
        for (const sw of this.shockwaves) {
          ctx.beginPath();
          ctx.arc(sw.x, sw.y, sw.radius, 0, Math.PI * 2);
          ctx.strokeStyle = sw.color;
          ctx.globalAlpha = Math.max(0, sw.alpha);
          ctx.lineWidth = 2.5;
          ctx.stroke();
        }

        // Particles
        for (const p of this.particles) {
          ctx.globalAlpha = Math.max(0, p.alpha);
          ctx.fillStyle = p.color;
          ctx.shadowBlur = 8;
          ctx.shadowColor = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();
        }

        // Floating texts
        ctx.shadowBlur = 6;
        for (const ft of this.floatingTexts) {
          ctx.globalAlpha = Math.max(0, ft.alpha);
          ctx.fillStyle = ft.color;
          ctx.shadowColor = ft.color;
          ctx.font = `900 ${Math.floor(14 * ft.scale)}px sans-serif`;
          ctx.textAlign = 'center';
          ctx.fillText(ft.text, ft.x, ft.y);
        }
        ctx.restore();
      }

      clear() {
        this.particles = [];
        this.floatingTexts = [];
        this.shockwaves = [];
      }
    }

    /* =====================================================================
       MAIN GAME CONTROLLER
       ===================================================================== */
    class NeonViperGame {
      constructor() {
        this.canvas = document.getElementById('canvas');
        this.ctx = this.canvas.getContext('2d');
        this.particles = new ParticlePool();

        // Grid parameters
        this.gridSize = 24; // 24x24 tiles
        this.cellSize = 24;
        this.boardWidth = this.gridSize * this.cellSize;
        this.boardHeight = this.gridSize * this.cellSize;

        // State Machine
        this.STATE_START = 0;
        this.STATE_PLAYING = 1;
        this.STATE_PAUSED = 2;
        this.STATE_GAMEOVER = 3;
        this.state = this.STATE_START;

        // Game Variables
        this.snake = [];
        this.dir = { x: 1, y: 0 };
        this.nextDirs = []; // Input Queue
        this.food = null;
        this.superFood = null;
        this.powerUp = null; // {x, y, type: 'GHOST' | 'MAGNET' | 'SLOW', duration}

        this.score = 0;
        this.highScore = parseInt(localStorage.getItem('neon_snake_high') || '0', 10);
        this.combo = 1.0;
        this.comboTimer = 0;
        this.maxComboTimer = 3.5; // seconds
        this.comboChain = 0;
        this.maxComboReached = 1.0;
        this.orbsCollected = 0;
        this.gameStartTime = 0;
        this.elapsedTime = 0;

        // Speed & Boost
        this.baseTickInterval = 110; // ms
        this.currentTickInterval = 110;
        this.lastTickTime = 0;
        this.isBoosting = false;
        this.boostEnergy = 100;
        this.maxBoostEnergy = 100;

        // Perks & Status
        this.ghostModeTimer = 0;
        this.magnetTimer = 0;

        // Screen Shake & Cam Juice
        this.shake = 0;
        this.chromaticGlitch = 0;

        // Rendering interpolation
        this.prevSnakePositions = [];
        this.tickAccumulator = 0;

        // High Score Table
        this.scoresTable = JSON.parse(localStorage.getItem('neon_snake_leaderboard') || '[]');

        this.initUI();
        this.resize();
        window.addEventListener('resize', () => this.resize());

        this.bindEvents();
        this.updateLeaderboardDisplay();

        // Run Loop
        this.lastFrameTime = performance.now();
        requestAnimationFrame((t) => this.loop(t));
      }

      initUI() {
        document.getElementById('hud-high').innerText = this.highScore.toLocaleString();
      }

      resize() {
        const dpr = window.devicePixelRatio || 1;
        const maxW = window.innerWidth * 0.94;
        const maxH = window.innerHeight * 0.88;

        let size = Math.min(maxW, maxH);
        if (size > 640) size = 640;

        this.cellSize = Math.floor(size / this.gridSize);
        this.boardWidth = this.cellSize * this.gridSize;
        this.boardHeight = this.cellSize * this.gridSize;

        this.canvas.width = this.boardWidth * dpr;
        this.canvas.height = this.boardHeight * dpr;
        this.canvas.style.width = `${this.boardWidth}px`;
        this.canvas.style.height = `${this.boardHeight}px`;

        this.ctx.scale(dpr, dpr);
      }

      bindEvents() {
        // Keyboard Controls
        window.addEventListener('keydown', (e) => {
          if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) {
            e.preventDefault();
          }
          sound.init();

          if (this.state === this.STATE_START && (e.code === 'Space' || e.code === 'Enter')) {
            this.startNewGame();
            return;
          }

          if (this.state === this.STATE_GAMEOVER && (e.code === 'KeyR' || e.code === 'Space' || e.code === 'Enter')) {
            this.startNewGame();
            return;
          }

          if (e.code === 'KeyP' || e.code === 'Escape') {
            this.togglePause();
            return;
          }

          if (e.code === 'KeyR' && this.state === this.STATE_PLAYING) {
            this.triggerGameOver();
            return;
          }

          if (e.code === 'ArrowUp' || e.code === 'KeyW') this.queueDirection(0, -1);
          if (e.code === 'ArrowDown' || e.code === 'KeyS') this.queueDirection(0, 1);
          if (e.code === 'ArrowLeft' || e.code === 'KeyA') this.queueDirection(-1, 0);
          if (e.code === 'ArrowRight' || e.code === 'KeyD') this.queueDirection(1, 0);

          if (e.code === 'Space' || e.shiftKey) {
            this.isBoosting = true;
          }
        });

        window.addEventListener('keyup', (e) => {
          if (e.code === 'Space' || !e.shiftKey) {
            this.isBoosting = false;
          }
        });

        // Touch Virtual D-Pad
        const bindTouchBtn = (id, dx, dy) => {
          const el = document.getElementById(id);
          el.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            sound.init();
            this.queueDirection(dx, dy);
          });
        };
        bindTouchBtn('t-up', 0, -1);
        bindTouchBtn('t-down', 0, 1);
        bindTouchBtn('t-left', -1, 0);
        bindTouchBtn('t-right', 1, 0);

        // Boost touch button
        const boostBtn = document.getElementById('t-boost');
        const startBoost = (e) => {
          e.preventDefault();
          sound.init();
          this.isBoosting = true;
          boostBtn.classList.add('active');
        };
        const endBoost = (e) => {
          e.preventDefault();
          this.isBoosting = false;
          boostBtn.classList.remove('active');
        };
        boostBtn.addEventListener('pointerdown', startBoost);
        boostBtn.addEventListener('pointerup', endBoost);
        boostBtn.addEventListener('pointercancel', endBoost);

        // Canvas Swipes
        let touchStartX = 0, touchStartY = 0;
        this.canvas.addEventListener('touchstart', (e) => {
          const t = e.touches[0];
          touchStartX = t.clientX;
          touchStartY = t.clientY;
          sound.init();
        }, { passive: true });

        this.canvas.addEventListener('touchend', (e) => {
          const t = e.changedTouches[0];
          const dx = t.clientX - touchStartX;
          const dy = t.clientY - touchStartY;
          if (Math.hypot(dx, dy) > 20) {
            if (Math.abs(dx) > Math.abs(dy)) {
              this.queueDirection(dx > 0 ? 1 : -1, 0);
            } else {
              this.queueDirection(0, dy > 0 ? 1 : -1);
            }
          }
        }, { passive: true });

        // UI Buttons
        document.getElementById('btn-play').onclick = () => { sound.init(); this.startNewGame(); };
        document.getElementById('btn-restart').onclick = () => { sound.init(); this.startNewGame(); };
        document.getElementById('btn-restart-pause').onclick = () => { sound.init(); this.startNewGame(); };
        document.getElementById('btn-resume').onclick = () => this.togglePause();
        document.getElementById('btn-pause').onclick = () => this.togglePause();
        document.getElementById('btn-menu').onclick = () => this.showScreen(this.STATE_START);
        
        document.getElementById('btn-sound').onclick = () => {
          sound.init();
          const muted = sound.toggleMute();
          document.getElementById('btn-sound').innerText = muted ? '🔇' : '🔊';
        };
      }

      queueDirection(dx, dy) {
        if (this.state !== this.STATE_PLAYING) return;
        const lastPlanned = this.nextDirs.length > 0 
          ? this.nextDirs[this.nextDirs.length - 1] 
          : this.dir;

        if (lastPlanned.x + dx === 0 && lastPlanned.y + dy === 0) return;

        if (this.nextDirs.length < 2) {
          this.nextDirs.push({ x: dx, y: dy });
        }
      }

      showScreen(screenState) {
        this.state = screenState;
        document.getElementById('screen-start').classList.toggle('active', screenState === this.STATE_START);
        document.getElementById('screen-pause').classList.toggle('active', screenState === this.STATE_PAUSED);
        document.getElementById('screen-gameover').classList.toggle('active', screenState === this.STATE_GAMEOVER);
      }

      togglePause() {
        if (this.state === this.STATE_PLAYING) {
          this.showScreen(this.STATE_PAUSED);
        } else if (this.state === this.STATE_PAUSED) {
          this.showScreen(this.STATE_PLAYING);
        }
      }

      startNewGame() {
        const center = Math.floor(this.gridSize / 2);
        this.snake = [
          { x: center, y: center },
          { x: center - 1, y: center },
          { x: center - 2, y: center }
        ];
        this.prevSnakePositions = JSON.parse(JSON.stringify(this.snake));
        this.dir = { x: 1, y: 0 };
        this.nextDirs = [];
        this.score = 0;
        this.combo = 1.0;
        this.comboChain = 0;
        this.comboTimer = 0;
        this.maxComboReached = 1.0;
        this.orbsCollected = 0;
        this.boostEnergy = 100;
        this.isBoosting = false;
        this.ghostModeTimer = 0;
        this.magnetTimer = 0;
        this.superFood = null;
        this.powerUp = null;
        this.gameStartTime = performance.now();
        this.elapsedTime = 0;
        this.shake = 0;
        this.particles.clear();

        this.spawnFood();
        this.showScreen(this.STATE_PLAYING);
        this.updateHUD();
      }

      spawnFood() {
        const occupied = new Set(this.snake.map(s => `${s.x},${s.y}`));
        const available = [];
        for (let x = 1; x < this.gridSize - 1; x++) {
          for (let y = 1; y < this.gridSize - 1; y++) {
            if (!occupied.has(`${x},${y}`)) available.push({ x, y });
          }
        }
        if (available.length > 0) {
          this.food = available[Math.floor(Math.random() * available.length)];
        }
      }

      spawnSuperFood() {
        const occupied = new Set(this.snake.map(s => `${s.x},${s.y}`));
        const available = [];
        for (let x = 2; x < this.gridSize - 2; x++) {
          for (let y = 2; y < this.gridSize - 2; y++) {
            if (!occupied.has(`${x},${y}`) && !(this.food && this.food.x === x && this.food.y === y)) {
              available.push({ x, y });
            }
          }
        }
        if (available.length > 0) {
          this.superFood = available[Math.floor(Math.random() * available.length)];
          this.superFood.life = 7.0;
          this.particles.spawnShockwave(
            (this.superFood.x + 0.5) * this.cellSize,
            (this.superFood.y + 0.5) * this.cellSize,
            '#ffe600'
          );
        }
      }

      spawnPowerUp() {
        const occupied = new Set(this.snake.map(s => `${s.x},${s.y}`));
        const available = [];
        for (let x = 2; x < this.gridSize - 2; x++) {
          for (let y = 2; y < this.gridSize - 2; y++) {
            if (!occupied.has(`${x},${y}`)) available.push({ x, y });
          }
        }
        if (available.length > 0) {
          const types = ['GHOST', 'MAGNET', 'HYPER'];
          const chosen = types[Math.floor(Math.random() * types.length)];
          this.powerUp = {
            ...available[Math.floor(Math.random() * available.length)],
            type: chosen,
            life: 8.0
          };
        }
      }

      tick() {
        if (this.state !== this.STATE_PLAYING) return;

        this.prevSnakePositions = JSON.parse(JSON.stringify(this.snake));

        if (this.nextDirs.length > 0) {
          this.dir = this.nextDirs.shift();
        }

        const head = { ...this.snake[0] };
        head.x += this.dir.x;
        head.y += this.dir.y;

        // Wall check
        if (head.x < 0 || head.x >= this.gridSize || head.y < 0 || head.y >= this.gridSize) {
          this.triggerGameOver();
          return;
        }

        // Self check
        if (this.ghostModeTimer <= 0) {
          for (let i = 0; i < this.snake.length - 1; i++) {
            if (this.snake[i].x === head.x && this.snake[i].y === head.y) {
              this.triggerGameOver();
              return;
            }
          }
        }

        this.snake.unshift(head);

        // Magnet Aura
        if (this.magnetTimer > 0 && this.food) {
          const dist = Math.hypot(this.food.x - head.x, this.food.y - head.y);
          if (dist < 4 && dist > 0) {
            if (Math.random() < 0.6) {
              if (this.food.x < head.x) this.food.x++;
              else if (this.food.x > head.x) this.food.x--;
              if (this.food.y < head.y) this.food.y++;
              else if (this.food.y > head.y) this.food.y--;
            }
          }
        }

        let grew = false;

        // Check Food
        if (this.food && head.x === this.food.x && head.y === this.food.y) {
          this.eatFood();
          grew = true;
        }

        // Check Super Food
        if (this.superFood && head.x === this.superFood.x && head.y === this.superFood.y) {
          this.eatSuperFood();
          grew = true;
        }

        // Check Power-up
        if (this.powerUp && head.x === this.powerUp.x && head.y === this.powerUp.y) {
          this.eatPowerUp();
        }

        if (!grew) {
          this.snake.pop();
        }

        if (this.isBoosting && this.boostEnergy > 0) {
          const tail = this.snake[this.snake.length - 1];
          this.particles.spawn(
            (tail.x + 0.5) * this.cellSize,
            (tail.y + 0.5) * this.cellSize,
            '#00f3ff', 2, 2
          );
        }
      }

      eatFood() {
        this.orbsCollected++;
        this.comboChain++;
        this.comboTimer = this.maxComboTimer;
        this.combo = Math.min(8.0, 1.0 + (this.comboChain * 0.25));
        if (this.combo > this.maxComboReached) this.maxComboReached = this.combo;

        const pts = Math.floor(100 * this.combo * (this.isBoosting ? 1.5 : 1.0));
        this.score += pts;
        this.boostEnergy = Math.min(this.maxBoostEnergy, this.boostEnergy + 12);

        const worldX = (this.food.x + 0.5) * this.cellSize;
        const worldY = (this.food.y + 0.5) * this.cellSize;

        sound.playBite(this.comboChain);
        this.particles.spawn(worldX, worldY, '#00f3ff', 16, 5);
        this.particles.spawnText(worldX, worldY, `+${pts}`);
        this.shake = Math.min(this.shake + 3, 10);

        this.spawnFood();

        if (!this.superFood && Math.random() < 0.28) {
          this.spawnSuperFood();
        }
        if (!this.powerUp && Math.random() < 0.18) {
          this.spawnPowerUp();
        }
      }

      eatSuperFood() {
        const pts = Math.floor(500 * this.combo);
        this.score += pts;
        this.boostEnergy = this.maxBoostEnergy;
        const worldX = (this.superFood.x + 0.5) * this.cellSize;
        const worldY = (this.superFood.y + 0.5) * this.cellSize;

        sound.playSuperBite();
        this.particles.spawn(worldX, worldY, '#ffe600', 30, 8);
        this.particles.spawnShockwave(worldX, worldY, '#ffe600');
        this.particles.spawnText(worldX, worldY, `SUPER NOVA! +${pts}`, '#ffe600');
        this.shake = 12;
        this.superFood = null;
      }

      eatPowerUp() {
        const type = this.powerUp.type;
        const worldX = (this.powerUp.x + 0.5) * this.cellSize;
        const worldY = (this.powerUp.y + 0.5) * this.cellSize;

        sound.playPowerup();
        this.particles.spawn(worldX, worldY, '#9d00ff', 24, 6);
        this.shake = 8;

        if (type === 'GHOST') {
          this.ghostModeTimer = 6.0;
          this.particles.spawnText(worldX, worldY, 'GHOST PHASE!', '#9d00ff');
        } else if (type === 'MAGNET') {
          this.magnetTimer = 8.0;
          this.particles.spawnText(worldX, worldY, 'MAGNET FIELD!', '#00ff66');
        } else if (type === 'HYPER') {
          this.comboChain += 4;
          this.combo = Math.min(8.0, this.combo + 2.0);
          this.particles.spawnText(worldX, worldY, 'HYPER DRIVE!', '#ff0055');
        }

        this.powerUp = null;
    }
            triggerGameOver() {
        if (this.state !== this.STATE_PLAYING) return;
        this.showScreen(this.STATE_GAMEOVER);
        sound.playDie();
        this.shake = 22;
        this.chromaticGlitch = 15;

        if (this.snake.length > 0) {
          const h = this.snake[0];
          this.particles.spawn((h.x + 0.5) * this.cellSize, (h.y + 0.5) * this.cellSize, '#ff0055', 40, 10);
          this.particles.spawnShockwave((h.x + 0.5) * this.cellSize, (h.y + 0.5) * this.cellSize, '#ff0055');
        }

        document.getElementById('go-score').innerText = this.score.toLocaleString();
        document.getElementById('go-combo').innerText = `${this.maxComboReached.toFixed(1)}x`;
        document.getElementById('go-orbs').innerText = this.orbsCollected;
        
        const mins = Math.floor(this.elapsedTime / 60);
        const secs = Math.floor(this.elapsedTime % 60);
        document.getElementById('go-time').innerText = `${mins.toString().padStart(2,'0')}:${secs.toString().padStart(2,'0')}`;

        const isNewHigh = this.score > this.highScore;
        if (isNewHigh) {
          this.highScore = this.score;
          localStorage.setItem('neon_snake_high', this.highScore.toString());
          document.getElementById('hud-high').innerText = this.highScore.toLocaleString();
        }
        document.getElementById('new-high-banner').style.display = isNewHigh && this.score > 0 ? 'block' : 'none';

        this.saveScoreToLeaderboard(this.score);
      }

      saveScoreToLeaderboard(score) {
        if (score <= 0) return;
        this.scoresTable.push({
          score,
          combo: this.maxComboReached.toFixed(1),
          date: new Date().toLocaleDateString(undefined, { month: 'short', day: 'numeric' })
        });
        this.scoresTable.sort((a, b) => b.score - a.score);
        this.scoresTable = this.scoresTable.slice(0, 5);
        localStorage.setItem('neon_snake_leaderboard', JSON.stringify(this.scoresTable));
        this.updateLeaderboardDisplay();
      }

      updateLeaderboardDisplay() {
        const container = document.getElementById('start-leaderboard');
        if (this.scoresTable.length === 0) {
          container.innerHTML = `<div style="text-align:center; font-size:11px; color:#556;">NO FLIGHT RECORDS YET</div>`;
          return;
        }
        container.innerHTML = this.scoresTable.map((item, idx) => `
          <div class="leaderboard-item">
            <span><b>#${idx + 1}</b> ${item.date} (${item.combo}x)</span>
            <span style="font-weight:900; font-family:monospace;">${item.score.toLocaleString()}</span>
          </div>
        `).join('');
      }

      updateHUD() {
        document.getElementById('hud-score').innerText = this.score.toLocaleString().padStart(6, '0');
        document.getElementById('combo-text').innerText = `${this.combo.toFixed(1)}X`;
        const comboPct = Math.max(0, Math.min(100, (this.comboTimer / this.maxComboTimer) * 100));
        document.getElementById('combo-fill').style.width = `${comboPct}%`;
        document.getElementById('boost-fill').style.width = `${this.boostEnergy}%`;
      }

      loop(timestamp) {
        const dt = Math.min((timestamp - this.lastFrameTime) / 1000, 0.1);
        this.lastFrameTime = timestamp;

        if (this.state === this.STATE_PLAYING) {
          this.elapsedTime += dt;

          if (this.isBoosting && this.boostEnergy > 0) {
            this.boostEnergy = Math.max(0, this.boostEnergy - dt * 45);
            this.currentTickInterval = this.baseTickInterval * 0.52;
            if (this.boostEnergy <= 0) this.isBoosting = false;
          } else {
            this.boostEnergy = Math.min(this.maxBoostEnergy, this.boostEnergy + dt * 10);
            const speedUp = Math.min(45, this.orbsCollected * 1.2);
            this.currentTickInterval = this.baseTickInterval - speedUp;
          }

          if (this.comboTimer > 0) {
            this.comboTimer -= dt;
            if (this.comboTimer <= 0) {
              this.combo = 1.0;
              this.comboChain = 0;
            }
          }

          if (this.superFood) {
            this.superFood.life -= dt;
            if (this.superFood.life <= 0) this.superFood = null;
          }
          if (this.powerUp) {
            this.powerUp.life -= dt;
            if (this.powerUp.life <= 0) this.powerUp = null;
          }
          if (this.ghostModeTimer > 0) this.ghostModeTimer -= dt;
          if (this.magnetTimer > 0) this.magnetTimer -= dt;

          this.tickAccumulator += dt * 1000;
          if (this.tickAccumulator >= this.currentTickInterval) {
            this.tick();
            this.tickAccumulator = 0;
          }

          this.updateHUD();
        }

        this.particles.update(dt);
        this.render(this.tickAccumulator / this.currentTickInterval);

        requestAnimationFrame((t) => this.loop(t));
      }

      render(interpolationAlpha) {
        const ctx = this.ctx;
        ctx.save();

        if (this.shake > 0) {
          const shakeX = (Math.random() - 0.5) * this.shake;
          const shakeY = (Math.random() - 0.5) * this.shake;
          ctx.translate(shakeX, shakeY);
          this.shake = Math.max(0, this.shake - 0.6);
        }

        ctx.fillStyle = '#080911';
        ctx.fillRect(0, 0, this.boardWidth, this.boardHeight);

        // Cyberpunk Grid
        ctx.strokeStyle = 'rgba(0, 243, 255, 0.05)';
        ctx.lineWidth = 1;
        for (let x = 0; x <= this.gridSize; x++) {
          ctx.beginPath();
          ctx.moveTo(x * this.cellSize, 0);
          ctx.lineTo(x * this.cellSize, this.boardHeight);
          ctx.stroke();
        }
        for (let y = 0; y <= this.gridSize; y++) {
          ctx.beginPath();
          ctx.moveTo(0, y * this.cellSize);
          ctx.lineTo(this.boardWidth, y * this.cellSize);
          ctx.stroke();
        }

        // Border
        ctx.strokeStyle = this.ghostModeTimer > 0 ? '#9d00ff' : 'rgba(0, 243, 255, 0.4)';
        ctx.shadowColor = this.ghostModeTimer > 0 ? '#9d00ff' : '#00f3ff';
        ctx.shadowBlur = 12;
        ctx.lineWidth = 2;
        ctx.strokeRect(1, 1, this.boardWidth - 2, this.boardHeight - 2);

        this.drawPickups(ctx);

        if (this.snake.length > 0) {
          this.drawSnake(ctx, Math.min(1, Math.max(0, interpolationAlpha)));
        }

        this.particles.draw(ctx);

        if (this.chromaticGlitch > 0) {
          ctx.fillStyle = 'rgba(255, 0, 85, 0.15)';
          ctx.fillRect(0, 0, this.boardWidth, this.boardHeight);
          this.chromaticGlitch--;
        }

        ctx.restore();
      }

      drawPickups(ctx) {
        const time = performance.now() * 0.005;

        // Food Orb
        if (this.food) {
          const fx = (this.food.x + 0.5) * this.cellSize;
          const fy = (this.food.y + 0.5) * this.cellSize;
          const pulse = Math.sin(time * 3) * 2;

          ctx.save();
          ctx.shadowBlur = 15;
          ctx.shadowColor = '#00f3ff';
          ctx.fillStyle = '#00f3ff';
          ctx.beginPath();
          ctx.arc(fx, fy, (this.cellSize * 0.32) + pulse, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.arc(fx, fy, (this.cellSize * 0.15), 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        // Super Nova Orb
        if (this.superFood) {
          const sx = (this.superFood.x + 0.5) * this.cellSize;
          const sy = (this.superFood.y + 0.5) * this.cellSize;
          const rot = time * 2;

          ctx.save();
          ctx.translate(sx, sy);
          ctx.rotate(rot);
          ctx.shadowBlur = 20;
          ctx.shadowColor = '#ffe600';
          ctx.fillStyle = '#ffe600';

          const dSize = this.cellSize * 0.45;
          ctx.beginPath();
          ctx.moveTo(0, -dSize);
          ctx.lineTo(dSize, 0);
          ctx.lineTo(0, dSize);
          ctx.lineTo(-dSize, 0);
          ctx.closePath();
          ctx.fill();

          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 2;
          ctx.stroke();
          ctx.restore();
        }

        // Power-Up Capsule
        if (this.powerUp) {
          const px = (this.powerUp.x + 0.5) * this.cellSize;
          const py = (this.powerUp.y + 0.5) * this.cellSize;
          const color = this.powerUp.type === 'GHOST' ? '#9d00ff' : '#ff0055';

          ctx.save();
          ctx.shadowBlur = 18;
          ctx.shadowColor = color;
          ctx.fillStyle = color;
          ctx.beginPath();
          ctx.arc(px, py, this.cellSize * 0.38, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#ffffff';
          ctx.font = 'bold 10px sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(this.powerUp.type[0], px, py);
          ctx.restore();
        }
      }

      drawSnake(ctx, alpha) {
        ctx.save();

        const isGhost = this.ghostModeTimer > 0;
        const mainColor = isGhost ? '#9d00ff' : (this.isBoosting ? '#00f3ff' : '#00ffaa');
        const glowColor = isGhost ? '#c042ff' : (this.isBoosting ? '#00a2ff' : '#00ff88');

        ctx.shadowBlur = this.isBoosting ? 22 : 12;
        ctx.shadowColor = glowColor;

        for (let i = this.snake.length - 1; i >= 0; i--) {
          const curr = this.snake[i];
          const prev = this.prevSnakePositions[i] || curr;

          const ix = prev.x + (curr.x - prev.x) * alpha;
          const iy = prev.y + (curr.y - prev.y) * alpha;

          const cx = (ix + 0.5) * this.cellSize;
          const cy = (iy + 0.5) * this.cellSize;

          const isHead = i === 0;
          const radiusRatio = isHead ? 0.44 : 0.36 * (1 - (i / (this.snake.length * 1.6)));
          const radius = Math.max(4, this.cellSize * radiusRatio);

          ctx.beginPath();
          ctx.arc(cx, cy, radius, 0, Math.PI * 2);

          if (isHead) {
            ctx.fillStyle = '#ffffff';
            ctx.fill();

            ctx.fillStyle = mainColor;
            ctx.beginPath();
            ctx.arc(
              cx + this.dir.x * (radius * 0.4),
              cy + this.dir.y * (radius * 0.4),
              radius * 0.5, 0, Math.PI * 2
            );
            ctx.fill();
          } else {
            ctx.fillStyle = isGhost ? 'rgba(157, 0, 255, 0.6)' : mainColor;
            ctx.fill();
          }
        }
        ctx.restore();
      }
    }

    // Initialize Game Engine on Load
    window.addEventListener('DOMContentLoaded', () => {
      window.game = new NeonViperGame();
    });
  </script>
</body>
</html>
